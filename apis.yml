description: >-
  Cleanup.pictures provides AI-powered photo cleanup, object and watermark removal via
  inpainting. The public API is hosted on the ClipDrop platform (now Jasper.ai) at
  https://clipdrop-api.co/cleanup/v1, billed at 1 credit per successful call.
