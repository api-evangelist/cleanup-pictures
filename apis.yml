apis:
  - aid: cleanup-pictures:cleanup
    name: Cleanup.pictures Inpainting API
    description: >-
      REST API for object/watermark/blemish removal via mask-based inpainting. POST
      multipart/form-data with image_file, mask_file, and optional mode (fast/quality) to
      https://clipdrop-api.co/cleanup/v1. Default quota is 60 requests/minute. 1 successful
      call = 1 credit. Hosted on ClipDrop (Jasper.ai).
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
